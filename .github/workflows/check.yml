name: Local foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
  basic-pitch-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            python/requirements-lock.txt
            python/vendor/basic-pitch-onnx/pyproject.toml
      - run: npm ci
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r python/requirements-lock.txt
      - run: .venv/bin/python -m pip check
      - run: npm run test:python
      - run: npm run fixture
      - run: npm run cli -- work/fixtures/melody.wav --out work/smoke/melody --tempo 90 --time 3/4
      - run: npm run cli -- work/fixtures/chords.wav --out work/smoke/chords
      - run: npm run cli -- work/fixtures/silence.wav --out work/smoke/silence
      - run: .venv/bin/python python/check_smoke.py work/smoke/melody
      - run: .venv/bin/python python/check_regression.py work/smoke
