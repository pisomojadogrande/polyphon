name: Local foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s python -p 'test_*.py'
  basic-pitch-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/requirements-lock.txt
      - run: npm ci
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r python/requirements-lock.txt
      - run: npm run fixture
      - run: npm run cli -- work/fixtures/melody.wav --out work/smoke
      - run: .venv/bin/python python/check_smoke.py work/smoke
