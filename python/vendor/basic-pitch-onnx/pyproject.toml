[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyphon-basic-pitch-onnx"
version = "0.4.0.post1"
description = "Polyphon's ONNX-only adaptation of Spotify Basic Pitch 0.4.0"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.md"]
dependencies = [
  "librosa==0.11.0", "mir-eval==0.8.2", "numpy==2.4.6",
  "onnxruntime==1.31.0", "pretty-midi==0.2.11.post0",
  "resampy==0.4.3", "scipy==1.17.1", "numba==0.68.0",
]

[tool.setuptools]
packages = ["polyphon_basic_pitch"]

[tool.setuptools.package-data]
polyphon_basic_pitch = ["saved_models/icassp_2022/nmp.onnx"]
